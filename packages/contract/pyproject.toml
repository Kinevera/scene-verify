[project]
name = "scene-verify-contract"
version = "0.4.0"
description = "The scene_verify/1 verdict contract: its constants, typed structures and validator, standard library only"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Cybernetic" }]
# No dependencies: a consumer such as SceneForge's API pins the contract without the engine's
# numpy, trimesh or USD (scene-verify-0001).
dependencies = []

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scene_verify_contract"
