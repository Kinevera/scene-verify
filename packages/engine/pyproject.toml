[project]
name = "scene-verify"
version = "0.3.0"
description = "The scene verifier engine: grades a USD scene's geometry and physics and writes a scene_verify/1 verdict"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Cybernetic" }]
# Lower bounds only, so the engine installs into Isaac Sim 5.1's Python, which bundles numpy
# 1.26.0, trimesh 4.5.1 and PyYAML 6.0.2. pxr, isaacsim, omni and carb come from the runtime
# the engine runs in and are not declared.
dependencies = [
  "scene-verify-contract==0.3.0",
  "numpy>=1.26",
  "trimesh>=4.5",
  "PyYAML>=6.0",
]

[tool.uv.sources]
scene-verify-contract = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scene_verify"
