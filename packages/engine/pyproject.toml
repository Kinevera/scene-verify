[project]
name = "scene-verify"
version = "0.4.0"
description = "The scene verifier engine: grades a USD scene's geometry and physics and writes a scene_verify/1 verdict"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Cybernetic" }]
# Lower bounds that Isaac Sim 5.1's Python meets (it bundles numpy 1.26.0, trimesh 4.5.1,
# PyYAML 6.0.2 and scipy 1.15.3). trimesh needs scipy for the convex-hull collision proxy and
# winding repair; without it the proxy silently falls back to the visual mesh, so scipy is
# declared. trimesh stays below 5 because the verifier's numbers were evidenced on 4.5 and 4.12
# only; lifting the cap needs a run showing the verdicts unchanged (scene-verify-0001, Q7).
# pxr, isaacsim, omni and carb come from the runtime the engine runs in and are not declared.
dependencies = [
  "scene-verify-contract==0.4.0",
  "numpy>=1.26",
  "trimesh>=4.5,<5",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[tool.uv.sources]
scene-verify-contract = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scene_verify"
